<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sushila Engineering Works</title>
<script src="jspdf.umd.min.js"></script>
<script src="xlsx.full.min.js"></script>
<style>
:root{--bg:#060a14;--card:#0d1526;--c2:#111d36;--bd:#1f2e4d;--tx:#e8edf7;--mu:#8a97b0;--ac:#ffb400;--onac:#111;--gn:#2ecc8f;--rd:#ff6b6b;--bl:#4f8cff;--tl:#36c2d6;--th:#14234a;--thc:#dbe5ff;--nav:#080e1d;color-scheme:dark;box-sizing:border-box}
[data-th=day]{--bg:#eef2fa;--card:#ffffff;--c2:#e6edfb;--bd:#d6dff0;--tx:#0b2545;--mu:#64748f;--ac:#2f5bff;--onac:#fff;--gn:#0f9d6a;--rd:#e5484d;--bl:#2f5bff;--tl:#0e9db0;--th:#e3eafb;--thc:#0b2545;--nav:#ffffff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
header,header b{color:#fff}header{background:linear-gradient(120deg,#04070d,#0f1d44 65%,#16306b);border-bottom:2px solid var(--ac);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px}
.br{display:flex;gap:10px;align-items:center;max-width:1100px;margin:auto}.br>div{flex:1;min-width:0}.hb{background:#ffffff1a;border:1px solid #ffffff40;color:#fff;border-radius:8px;padding:5px 8px;font-size:12px;width:auto}.hb option{color:#000}
header b{font-size:19px;letter-spacing:.3px;display:block}header small{color:#b9c6e4;font-size:11px;display:block}
main{padding:12px;max-width:1100px;margin:auto}
h2{font-size:15px;margin:0 0 8px}h3{font-size:13px;margin:0 0 6px;color:#c9d4ec}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 6px #0006}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tab{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:18px}
.tab.on{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:700}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font-size:14px}
input[type=checkbox]{width:auto}
.lk[readonly]{border-style:dashed;caret-color:transparent}
.lk.ed{border:2px solid var(--ac);background:var(--c2)}
label{font-size:11px;color:var(--mu);display:block;margin-bottom:2px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ln{display:grid;grid-template-columns:1.5fr 1.2fr .7fr auto;gap:6px;align-items:center;margin-bottom:6px}
.ln .itc{grid-column:1/4;font-size:11px;color:var(--mu);margin-top:-3px}
button{font:inherit;cursor:pointer}
.x{border:0;background:none;color:var(--rd);font-size:19px;padding:0 6px}
.btn{border:1px solid var(--bl);background:none;color:var(--tx);padding:7px 12px;border-radius:7px;margin:2px 2px 2px 0}
.btn:hover{background:var(--c2)}.btn.p{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:700}.btn.d{border-color:var(--rd);color:var(--rd)}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--bd)}
.big{font-size:17px}.pos{color:var(--gn)}.neg{color:var(--rd)}
.sc{overflow:auto;max-height:68vh;margin-bottom:12px;border:1px solid var(--bd);border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;white-space:nowrap}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:right;background:var(--card)}
th{position:sticky;top:0;background:var(--th);z-index:2;color:var(--thc)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;border-right:1px solid var(--bd);max-width:88px;min-width:64px;overflow:hidden;text-overflow:ellipsis}
th:first-child{z-index:3}
tbody tr:hover td{background:var(--c2)}tr.cl{cursor:pointer}
tfoot td{font-weight:700;background:var(--th);color:var(--thc);position:sticky;bottom:0}
.note{font-size:11.5px;color:var(--mu)}.err{color:var(--rd);font-size:12px}.warn{color:var(--ac);font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:50}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0 6px;font-size:10.5px;transition:color .2s}nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 2px}
nav button.on{color:var(--ac);font-weight:700;border-top:3px solid var(--ac)}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--bl);border-radius:9px;padding:8px 10px}
.k small{color:var(--mu);font-size:11px;display:block}.k b{font-size:16px;font-variant-numeric:tabular-nums}.k em{font-style:normal;font-size:11px;margin-left:6px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}.cg .card{margin:0}
.ch{width:100%;height:auto;display:block}.dn{width:100%;max-width:210px;display:block;margin:auto}
.lgd{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:4px}.lgd i,.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.lg{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed var(--bd);font-size:12.5px;cursor:pointer}.lg span{flex:1}
.rk{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px;align-items:center;font-size:12.5px;padding:3px 0;cursor:pointer}
.rk div{background:var(--bd);height:9px;border-radius:5px}.rk b{display:block;height:100%;border-radius:5px}.rk em{font-style:normal}
.hm{display:grid;gap:2px;font-size:10px}.hm div{padding:6px 0;text-align:center;border-radius:3px;background:var(--c2)}
.emp{padding:22px 8px;text-align:center;color:var(--mu);border:1px dashed var(--bd);border-radius:8px;font-size:12px}
#tip{position:fixed;display:none;background:#000;border:1px solid var(--ac);color:#fff;padding:5px 8px;border-radius:6px;font-size:12px;pointer-events:none;z-index:99;max-width:250px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--gn);color:#00140a;padding:8px 16px;border-radius:20px;z-index:99;font-weight:600}
svg [data-t]{cursor:pointer}
.bdg{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}

#sheet{position:fixed;inset:0;background:#0009;z-index:90;display:flex;align-items:flex-end;justify-content:center}.sh{background:var(--card);border:1px solid var(--bd);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:82vh;overflow:auto;padding:12px 14px 18px;animation:slide .25s ease}
.dr{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}.dr img{width:44px;height:44px;object-fit:cover;border-radius:6px}.di{font-size:30px}.dn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
@keyframes slide{from{transform:translateY(40px);opacity:0}}@keyframes up{from{opacity:0;transform:translateY(8px)}}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}@keyframes grow{from{transform:scaleY(0)}}
.card,.k{animation:up .35s ease both}nav button.on svg{animation:pop .35s ease}svg.ch rect[data-t]{transform-box:fill-box;transform-origin:bottom;animation:grow .5s ease both}.btn:active,.tab:active{transform:scale(.96)}.hb:active{transform:rotate(30deg)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><div class="br"><span id="lg"></span><div><b>Sushila Engineering Works</b><small>PM Surya Ghar Yojana · SEW Business Manager</small></div><select id="hfy" class="hb" onchange="S.fy=this.value;S.an=-1;render()"></select><button class="hb" onclick="openSet()" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button></div></header>
<main id="m"></main>
<nav><button id="n1" onclick="go('c')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Customers</button><button id="n2" onclick="go('d')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Dashboard</button><button id="n3" onclick="go('b')"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M3 13h18"/></svg>Business</button><button id="n4" onclick="go('g')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>PM Ghar</button><button id="n5" onclick="go('p')"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Purchases</button><button id="n6" onclick="go('s')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Summary</button></nav>
<script>
const KEY='solarcalc1',$=i=>document.getElementById(i);
const L=(n,g)=>({n,a:0,g});
const dl=()=>[L('Panel',5),L('Inverter',5),L('Structure',18),L('Electrical',18),L('DC Cable + Earthing',18),L('Nutbolt / Hardware',0),L('Transport',0),L('Labour',0),L('MSEB',0),L('Referral',0),L('Other',0),L('Bank to be given',0)];
const nc=n=>({id:0,fy:'',name:n,dt:'',inv:0,rec:0,got:0,sp:70,sh:50,demo:false,lines:dl()});
let S={lo:5,hi:18,sel:0,pg:'c',fy:'all',an:-1,q:'',da:'',db:'',pur:[],biz:[],pm:[],bc:'all',bv:'r',bq:'',gv:'a',gq:'',gs:'',c:[nc('Customer 1')]};
try{const t=localStorage.getItem(KEY);if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
S.pur=S.pur||[];S.biz=S.biz||[];S.pm=S.pm||[];if(!S.c[S.sel])S.sel=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const f=n=>(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const R=n=>'₹ '+f(n),num=v=>parseFloat(v)||0;
const k=n=>{const a=Math.abs(n);return(n<0?'-':'')+(a>=1e7?(a/1e7).toFixed(1)+'Cr':a>=1e5?(a/1e5).toFixed(1)+'L':a>=1e3?(a/1e3).toFixed(0)+'K':a.toFixed(0))};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const cur=()=>S.c[S.sel],nd=()=>S.c.filter(c=>!c.demo),dm=()=>S.c.filter(c=>c.demo);
const PAL=['#4f8cff','#ffb400','#2ecc8f','#36c2d6','#ff6b6b','#a78bfa','#f472b6','#94a3b8','#fb923c','#22d3ee','#84cc16','#e879f9'];
const logo=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0b1530" stroke="#2a4a9a"/><circle cx="32" cy="24" r="8" fill="#ffb400"/><g><animateTransform attributeName="transform" type="rotate" from="0 32 24" to="360 32 24" dur="40s" repeatCount="indefinite"/><path stroke="#ffb400" stroke-width="3" stroke-linecap="round" d="M32 6v4M32 38v2M13 24h4M47 24h4M18.5 10.5l2.8 2.8M45.5 10.5l-2.8 2.8M18.5 37.5l2.8-2.8M45.5 37.5l-2.8-2.8"/></g><path d="M8 42h48l-4 16H12z" fill="#1d3a8a" stroke="#4f8cff" stroke-width="1.5"/><text x="32" y="55" text-anchor="middle" font-family="Arial" font-weight="900" font-size="12" fill="#fff">SEW</text></svg>`;
$('lg').innerHTML=logo(42);
/* FY helpers */
const pad=n=>String(n).padStart(2,'0');
const fyOf=d=>{if(!d)return'';const[y,m]=d.split('-').map(Number);return m>=4?y+'-'+pad((y+1)%100):(y-1)+'-'+pad(y%100)};
const prevFy=y=>{const a=+y.slice(0,4)-1;return a+'-'+pad((a+1)%100)};
const MN=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
const ml=m=>MN[(+m.slice(5)+8)%12]+" '"+m.slice(2,4);
const curFY=()=>{const n=new Date();return fyOf(n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate()))};
const nextFy=y=>{const a=+y.slice(0,4)+1;return a+'-'+pad((a+1)%100)};
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const fyC=c=>c.dt?fyOf(c.dt):(c.fy||'');
const fv=c=>S.fy=='all'||fyC(c)==S.fy;
const fys=()=>[...new Set([...S.c.map(fyC),...S.pur.map(p=>fyOf(p.dt)),...S.biz.map(x=>x.dt?fyOf(x.dt):x.fy),curFY(),prevFy(curFY()),nextFy(curFY())].filter(Boolean))].sort();
const cs=()=>nd().filter(fv),dmf=()=>dm().filter(fv);
const ps=()=>S.pur.filter(p=>S.fy=='all'||fyOf(p.dt)==S.fy);
function migrate(){S.c.forEach(c=>{if(!c.id)c.id=uid();if(!c.fy)c.fy=curFY()});S.biz.forEach(x=>{if(!x.dt&&!x.fy)x.fy=curFY()})}
migrate();S.fy=curFY();S.pg='d';S.an=-1;S.th=S.th||'dark';
function hfy(){$('hfy').innerHTML=['all',...fys()].map(y=>`<option value="${y}" ${S.fy==y?'selected':''}>${y=='all'?'All years':'FY '+y}</option>`).join('')}
function mkeys(){let a=[];if(S.fy!='all'){const y=+S.fy.slice(0,4);for(let i=0;i<12;i++){const m=(3+i)%12+1;a.push((m>=4?y:y+1)+'-'+pad(m))}}else a=[...new Set([...cs().map(c=>c.dt),...ps().map(p=>p.dt)].filter(Boolean).map(d=>d.slice(0,7)))].sort();return a}
const by=(l,fn)=>{const o={};l.forEach(x=>{if(x.dt){const m=x.dt.slice(0,7);o[m]=(o[m]||0)+fn(x)}});return o};
function calc(c){
 const exp=c.lines.reduce((s,l)=>s+num(l.a),0);
 const itc=c.lines.reduce((s,l)=>s+num(l.a)*num(l.g)/(100+num(l.g)),0);
 const out=num(c.inv)*(num(c.sp)/100*S.lo/100+(1-num(c.sp)/100)*S.hi/100);
 const res=out-itc,profit=num(c.rec)-exp-res;
 return{exp,itc,out,res,profit,part:profit*num(c.sh)/100,pend:num(c.rec)-num(c.got),diff:num(c.rec)-exp,rec:num(c.rec),inv:num(c.inv)};
}
function agg(l){const T={inv:0,rec:0,exp:0,out:0,itc:0,res:0,profit:0,part:0,pend:0};l.forEach(c=>{const q=calc(c);for(const x in T)T[x]+=q[x]});return T}
/* unlock by double-tap (customer page) */
let lt=0,le=null;
document.addEventListener('click',e=>{const t=e.target;if(!t.classList||!t.classList.contains('lk')||!t.readOnly)return;
 const n=Date.now();
 if(le===t&&n-lt<500){t.readOnly=false;t.classList.add('ed');t.focus();le=null;try{if(t.type=='date')t.showPicker()}catch(x){}}else{le=t;lt=n}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.classList&&t.classList.contains('lk')){t.readOnly=true;t.classList.remove('ed')}});
const I=(t,v,h)=>`<input class="lk" readonly ${t==1?'type="number" inputmode="decimal"':t==2?'type="date"':''} value="${esc(v)}" oninput="${h}">`;
/* tooltip */
const tp=document.createElement('div');tp.id='tip';document.body.appendChild(tp);
['pointerover','pointermove','pointerdown'].forEach(ev=>document.addEventListener(ev,e=>{const t=e.target.closest&&e.target.closest('[data-t]');
 if(!t){tp.style.display='none';return}tp.textContent=t.getAttribute('data-t');tp.style.display='block';
 tp.style.left=Math.max(6,Math.min(innerWidth-tp.offsetWidth-6,e.clientX-tp.offsetWidth/2))+'px';tp.style.top=Math.max(6,e.clientY-tp.offsetHeight-14)+'px'}));
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
let FM=R;
/* charts */
const emp=m=>`<div class="emp">${m||'No data for this view yet'}</div>`;
const leg=ss=>'<div class="lgd">'+ss.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')+'</div>';
const gl=(mn,sp,y,L0,W)=>[0,1,2,3,4].map(i=>{const v=mn+sp*i/4;return`<line x1="${L0}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="${L0-3}" y="${y(v)+3}" text-anchor="end" font-size="8" fill="var(--mu)">${k(v)}</text>`}).join('');
function xy(lb,ss,go){
 if(!lb.length)return emp();
 const W=360,H=190,L0=34,B=26,T=8,all=ss.flatMap(s=>s.v),mx=Math.max(1,...all),mn=Math.min(0,...all),sp=mx-mn;
 const y=v=>T+(H-T-B)*(1-(v-mn)/sp),n=lb.length,bw=(W-L0-6)/n,nc_=ss.filter(s=>s.t=='c').length||1,oc=go?j=>`onclick="${go}(${j})"`:()=>'';
 let g=gl(mn,sp,y,L0,W),ci=0;
 lb.forEach((l,j)=>g+=`<text x="${L0+bw*(j+.5)}" y="${H-10}" text-anchor="middle" font-size="8" fill="var(--mu)">${esc(String(l).slice(0,n>8?6:11))}</text>`);
 ss.forEach(s=>{
  if(s.t=='c'){const w=bw*.8/nc_;s.v.forEach((v,j)=>g+=`<rect x="${L0+bw*j+bw*.1+ci*w}" y="${Math.min(y(v),y(0))}" width="${w}" height="${Math.max(1,Math.abs(y(v)-y(0)))}" fill="${s.c}" rx="2" data-t="${esc(lb[j])} · ${esc(s.n)}: ${FM(v)}" ${oc(j)}/>`);ci++}
  else{const p=s.v.map((v,j)=>[L0+bw*(j+.5),y(v)]),d=p.map(q=>q.join(',')).join(' ');
   if(s.t=='a')g+=`<polygon points="${p[0][0]},${y(0)} ${d} ${p[n-1][0]},${y(0)}" fill="${s.c}" opacity=".25"/>`;
   g+=`<polyline points="${d}" fill="none" stroke="${s.c}" stroke-width="2"/>`+p.map((q,j)=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${s.c}" data-t="${esc(lb[j])} · ${esc(s.n)}: ${FM(s.v[j])}" ${oc(j)}/>`).join('')}});
 return`<svg viewBox="0 0 ${W} ${H}" class="ch">${g}</svg>`+leg(ss);
}
function donut(it,go){
 it=it.filter(x=>x.v>0);const tot=it.reduce((s,x)=>s+x.v,0);if(!tot)return emp();
 let a=-Math.PI/2,g='';const p=t=>(100+75*Math.cos(t)).toFixed(2)+' '+(100+75*Math.sin(t)).toFixed(2);
 it.forEach((x,i)=>{const fr=x.v/tot,b=a+fr*6.28318,c=x.c||PAL[i%12];x.c=c;const o=`data-t="${esc(x.n)}: ${FM(x.v)} (${(fr*100).toFixed(1)}%)" ${go?`onclick="${go}(${i})"`:''}`;
  g+=fr>.999?`<circle cx="100" cy="100" r="75" fill="none" stroke="${c}" stroke-width="28" ${o}/>`:`<path d="M${p(a)}A75 75 0 ${fr>.5?1:0} 1 ${p(b)}" fill="none" stroke="${c}" stroke-width="28" ${o}/>`;a=b});
 return`<svg viewBox="0 0 200 200" class="dn">${g}<text x="100" y="96" text-anchor="middle" font-size="9" fill="var(--mu)">Total</text><text x="100" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="var(--tx)">${k(tot)}</text></svg>`+
 it.map((x,i)=>`<div class="lg" ${go?`onclick="${go}(${i})"`:''}><i style="background:${x.c}"></i><span>${esc(x.n)}</span><b>${FM(x.v)}</b><small class="note">${(x.v/tot*100).toFixed(1)}%</small></div>`).join('');
}
function wf(st){
 let run=0;const bs=st.map(s=>{let a,b;if(s.t=='t'){a=0;b=s.v;run=s.v}else{a=run;b=run+s.v;run=b}return{...s,a,b}});

 <div class="card"><div class="g"><div><label>Search name / application / mobile</label><input value="${esc(S.gq)}" oninput="S.gq=this.value;$('gt').innerHTML=gtab(gml())"></div></div>${S.gs?`<p><button class="btn" onclick="S.gs='';render()">✕ Filter: ${esc(S.gs)}</button></p>`:''}<div id="gt" style="margin-top:8px">${gtab(l)}</div></div>`;
 $('m').innerHTML=`<div style="margin-bottom:10px"><b>PM Surya Ghar applications</b> <span class="note">${S.pm.length} total · ${kw.toFixed(2)} kWp</span></div><div style="margin-bottom:10px">${['l','a'].map(v=>`<button class="btn ${S.gv==v?'p':''}" onclick="S.gv='${v}';render()">${v=='l'?'📋 Applications':'📊 Analysis'}</button>`).join('')}</div>${S.gv=='a'?gdash():lst}`}

/* ===== documents (stored in IndexedDB inside the app) ===== */
let DB=null,DC={},DO={o:'',t:''},DOCL=[],DIRTY=false;
const dbp=new Promise(r=>{try{const q=indexedDB.open('sewdocs',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'id'});q.onsuccess=()=>{DB=q.result;r(DB)};q.onerror=()=>r(null)}catch(e){r(null)}});
const idb=(m,fn)=>dbp.then(db=>new Promise((res,rej)=>{if(!db)return rej('Document storage is not available');const t=db.transaction('f',m),q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
const dload=()=>idb('readonly',s=>s.getAll()).then(a=>{DC={};(a||[]).forEach(x=>DC[x.o]=(DC[x.o]||0)+1)}).catch(()=>{});
dload().then(()=>{if(!$('sheet')&&document.activeElement==document.body&&Object.keys(DC).length)render()});
function sheet(h){const o=$('sheet');if(o)o.remove();const d=document.createElement('div');d.id='sheet';d.innerHTML=`<div class="sh"><div style="text-align:right"><button class="x" style="color:var(--tx)" onclick="closeSheet()">✕</button></div>${h}</div>`;d.onclick=e=>{if(e.target==d)closeSheet()};document.body.appendChild(d)}
function closeSheet(){const d=$('sheet');if(d){d.remove();if(DIRTY){DIRTY=false;render()}}}
async function docs(o,t){DO={o,t};let a=[];try{a=((await idb('readonly',s=>s.getAll()))||[]).filter(x=>x.o==o)}catch(e){}
 DOCL=a;sheet(`<h3>📎 Documents – ${esc(t)}</h3>${a.length?a.map((x,i)=>`<div class="dr">${x.type.startsWith('image')?`<img src="${URL.createObjectURL(x.blob)}">`:'<span class="di">📄</span>'}<div style="flex:1;min-width:0"><div class="dn">${esc(x.name)}</div><div class="note">${(x.blob.size/1024).toFixed(0)} KB · ${x.d}</div></div><button class="btn" onclick="dshare(${i})">Open / Share</button><button class="x" onclick="ddel(${i})">🗑</button></div>`).join(''):'<div class="emp">No documents attached yet</div>'}
 <label class="btn p" style="display:inline-block;margin-top:10px">＋ Attach photo / PDF<input type="file" accept="image/*,application/pdf" multiple hidden onchange="dadd(this)"></label>
 <p class="note">Stored inside the app (no storage permission needed). Use “Open / Share” to send a file to WhatsApp, Drive or email. Backup can include documents.</p>`)}
const imgC=f_=>new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f_);im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b||f_),'image/jpeg',.72)};im.onerror=()=>res(f_);im.src=u});
async function dadd(inp){const fl=[...inp.files];inp.value='';let n=0;
 for(const f_ of fl){try{if(f_.size>15e6){alert(f_.name+' is larger than 15 MB and was skipped');continue}
  const img=f_.type.startsWith('image'),b=img?await imgC(f_):f_;
  await idb('readwrite',s=>s.put({id:uid(),o:DO.o,name:img?f_.name.replace(/\.\w+$/,'')+'.jpg':f_.name,type:img?'image/jpeg':(f_.type||'application/pdf'),d:today(),blob:b}));n++}catch(e){alert('Could not save '+f_.name+': '+e)}}
 await dload();DIRTY=true;docs(DO.o,DO.t);if(n)toast(n+' file(s) attached')}
function dshare(i){const x=DOCL[i],fr=new FileReader();fr.onload=()=>share(x.name,String(fr.result).split(',')[1],x.type);fr.readAsDataURL(x.blob)}
async function ddel(i){const x=DOCL[i];if(!confirm('Delete '+x.name+'?'))return;await idb('readwrite',s=>s.delete(x.id));await dload();DIRTY=true;docs(DO.o,DO.t)}
/* ===== settings, theme ===== */
function openSet(){sheet(`<h3>⚙ Settings</h3><p class="note">Theme</p><div class="g"><button class="btn ${S.th!='day'?'p':''}" onclick="setTh('dark')">🌙 Dark mode</button><button class="btn ${S.th=='day'?'p':''}" onclick="setTh('day')">☀️ Day mode</button></div>
 <p class="note" style="margin-top:12px">The app opens on the current financial year automatically (FY ${curFY()}). Use the FY box in the top bar to view other years.</p>
 <button class="btn" onclick="closeSheet();go('s')">💾 Backup &amp; restore</button><p class="note">SEW Business Manager · Sushila Engineering Works</p>`)}
function setTh(t){S.th=t;document.documentElement.setAttribute('data-th',t);save();openSet()}
/* ===== Android back button ===== */
(function(){const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;if(!A)return;
 A.addListener('backButton',()=>{if($('sheet')){closeSheet();return}
  if(S.an>=0){S.an=-1;render();return}
  if(S.pg!='d'){go('d');return}
  if(confirm('Close the app?'))A.exitApp()})})();
render();
</script></body></html>
